<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba doPost</title>
</head>
<body>
  <h2>Testeo de Envío de Datos a Google Apps Script</h2>
  <button onclick="enviar()">Enviar datos de prueba</button>

  <script>
    function enviar() {
      const datos = {
        fecha: "2025-04-14",
        hora: "17:00",
        lugar: "Control Sur",
        dominio: "ABC123",
        vehiculo: "Toyota Hilux",
        origen: "Salta",
        destino: "Jujuy",
        conductor: "Juan Pérez",
        dni: "12345678"
      };

      console.log("Enviando datos:", datos);

      fetch("https://script.google.com/macros/s/AKfycbzOS2k5oPhutEI02h5w_zNDIvpdpVSZtWQuHFrOfYVpdbY3EGl9wdEP-IVeUYI4gIyk/exec", {
        method: "POST",
        body: JSON.stringify(datos),
        headers: {
          "Content-Type": "application/json"
        }
      })
      .then(res => res.text())
      .then(respuesta => {
        console.log("Respuesta del servidor:", respuesta);
        alert("Respuesta: " + respuesta);
      })
      .catch(error => {
        console.error("Error:", error);
        alert("Falló la conexión o el envío.");
      });
    }
  </script>
</body>
</html>
