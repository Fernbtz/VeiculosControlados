<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registro de Vehículos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding: 2rem; }
    .form-section { margin-bottom: 2rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="mb-4 text-center">Registro de Vehículos</h1>

    <!-- Formulario -->
    <div class="form-section">
      <form id="registroForm" class="row g-3">
        <div class="col-md-2">
          <label class="form-label">Fecha</label>
          <input type="date" class="form-control" id="fecha" required>
        </div>
        <div class="col-md-2">
          <label class="form-label">Hora</label>
          <input type="time" class="form-control" id="hora" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Lugar</label>
          <input type="text" class="form-control" id="lugar" required>
        </div>
        <div class="col-md-2">
          <label class="form-label">Dominio</label>
          <input type="text" class="form-control" id="dominio" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Vehículo (Marca/Modelo)</label>
          <input type="text" class="form-control" id="vehiculo" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Origen</label>
          <input type="text" class="form-control" id="origen" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Destino</label>
          <input type="text" class="form-control" id="destino" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Conductor (Apellido y Nombre)</label>
          <input type="text" class="form-control" id="conductor" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">DNI</label>
          <input type="number" class="form-control" id="dni" required>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">Cargar Registro</button>
        </div>
      </form>
    </div>

    <!-- Buscador -->
    <div class="mb-3">
      <input type="text" id="buscador" class="form-control" placeholder="Buscar en los registros...">
    </div>

    <!-- Tabla -->
    <div class="table-responsive">
      <table class="table table-bordered table-hover" id="tablaRegistros">
        <thead class="table-dark">
          <tr>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Lugar</th>
            <th>Dominio</th>
            <th>Vehículo</th>
            <th>Origen</th>
            <th>Destino</th>
            <th>Conductor</th>
            <th>DNI</th>
          </tr>
        </thead>
        <tbody>
          <!-- Registros serán añadidos acá -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const form = document.getElementById('registroForm');
    const tabla = document.querySelector('#tablaRegistros tbody');
    const buscador = document.getElementById('buscador');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const datos = {
        fecha: document.getElementById('fecha').value,
        hora: document.getElementById('hora').value,
        lugar: document.getElementById('lugar').value,
        dominio: document.getElementById('dominio').value,
        vehiculo: document.getElementById('vehiculo').value,
        origen: document.getElementById('origen').value,
        destino: document.getElementById('destino').value,
        conductor: document.getElementById('conductor').value,
        dni: document.getElementById('dni').value
      };

      fetch("https://script.google.com/macros/s/AKfycbzqwGdGqUlAk-7f273C5VbxgsdvM-gxFSxJtmm2igU6BnkfCp3IDKcsCbbx9FBVPR0/exec", {
        method: "POST",
        body: JSON.stringify(datos),
        headers: {
          "Content-Type": "application/json"
        }
      })
      .then(response => response.text())
      .then(result => {
        if (result === "OK") {
          const fila = document.createElement('tr');
          for (let key in datos) {
            const td = document.createElement('td');
            td.textContent = datos[key];
            fila.appendChild(td);
          }
          tabla.appendChild(fila);
          form.reset();
          alert("Registro cargado correctamente.");
        } else {
          alert("Error al guardar el registro: " + result);
        }
      })
      .catch(error => {
        console.error("Error en la solicitud:", error);
        alert("Error al guardar el registro.");
      });
    });

    // Buscador en la tabla
    buscador.addEventListener('input', function () {
      const filtro = buscador.value.toLowerCase();
      const filas = tabla.getElementsByTagName('tr');
      for (let fila of filas) {
        const textoFila = fila.textContent.toLowerCase();
        fila.style.display = textoFila.includes(filtro) ? '' : 'none';
      }
    });
  </script>
</body>
</html>
